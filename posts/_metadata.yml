# options specified here will apply to all posts in this folder

# freeze: auto is inherited from _quarto.yml: a post re-executes only when its source changes

title-block-banner: false

toc: true
toc-depth: 3

page-layout: article

# Giscus comments on posts only (GitHub Discussions on lux-ferrata.github.io)
comments:
  giscus:
    repo: "lux-ferrata/lux-ferrata.github.io"
    repo-id: "R_kgDOThvy7g"
    category: "Announcements"
    category-id: "DIC_kwDOThvy7s4DB12m"
    mapping: "url"
    reactions-enabled: true
    input-position: top
    theme: preferred_color_scheme
    language: en
    loading: lazy
