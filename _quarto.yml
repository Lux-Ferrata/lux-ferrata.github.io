project:
  type: website
  resources:
  - CNAME
  - fonts/
  - og-image.png

website:
  title: "Lux Ferrata"
  description: "Personal blog."
  site-url: "https://lux-ferrata.org"
  favicon: Penrose_Valknut-3.svg
  search: true
  open-graph:
    image: og-image.png
  twitter-card:
    card-style: summary_large_image
    image: og-image.png
  page-footer:
    center: "© 2026 Lux Ferrata · Made with [Quarto](https://quarto.org) · [Content Policies](/content-policies.qmd)"
  navbar:
    right:
      - text: About
        href: author.qmd
      - text: Posts
        href: index.qmd
      - text: Projects
        href: projects.qmd
      - text: Archive
        href: archive.qmd
      - icon: github
        text: GitHub
        href: https://github.com/lux-ferrata
      - icon: rss
        text: RSS
        href: index.xml

format:
  html:
    theme:
      light: [flatly, theme.scss]
      dark: [darkly, theme.scss]
    css:
      - fonts/fonts.css
      - styles.css
    html-math-method: mathjax
    toc: true
    toc-location: right
    code-copy: true
    highlight-style: tn.theme
    code-fold: true
    citations-hover: true
    include-after-body:
      text: |
        <script data-goatcounter="https://xin-ferrata.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>

execute:
  freeze: auto

filters:
  - filters/project-nav.lua
