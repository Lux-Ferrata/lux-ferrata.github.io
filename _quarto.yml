project:
  type: website
  resources:
  - CNAME

website:
  title: "Lux Ferrata"
  description: "Personal blog."
  site-url: "https://lux-ferrata.org"
  favicon: Penrose_Valknut-3.svg
  search: true
  open-graph:
    image: Penrose_Valknut-3.svg
  page-footer:
    center: "© 2026 Lux Ferrata · Made with [Quarto](https://quarto.org) · [Content Policies](content-policies.qmd)"
  navbar:
    right:
      - text: About
        href: author.qmd
      - text: Posts
        href: index.qmd
      - text: Projects
        href: projects.qmd
      - text: Archive
        href: archive.qmd
      - icon: github
        text: GitHub
        href: https://github.com/lux-ferrata
      - icon: rss
        text: RSS
        href: index.xml

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    html-math-method: mathjax
    toc: true
    toc-location: right
    code-copy: true
    code-fold: true
    citations-hover: true
    include-after-body:
      text: |
        <script data-goatcounter="https://xin-ferrata.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>
        <script>
          // Visible per-page view counter. Reads the count for the current
          // path from GoatCounter's counter endpoint and drops it into the
          // title block. Requires "Allow adding visitor counts to your
          // website" to be enabled in the GoatCounter site settings.
          (function () {
            var path = location.pathname.replace(/\/index\.html$/, "/");
            if (path.length > 1) path = path.replace(/\/$/, "");
            var url = "https://xin-ferrata.goatcounter.com/counter/" +
                      encodeURIComponent(path) + ".json";
            fetch(url)
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (d) {
                if (!d) return;
                var host = document.querySelector("#title-block-header .quarto-title-meta");
                if (!host) host = document.querySelector("#title-block-header");
                if (!host) return;
                var el = document.createElement("div");
                el.className = "goatcounter-views";
                el.textContent = d.count_unique + " views";
                host.appendChild(el);
              })
              .catch(function () {});
          })();
        </script>

comments:
  giscus:
    repo: "lux-ferrata/lux-ferrata.github.io"
    repo-id: "R_kgDOThvy7g"
    category: "Announcements"
    category-id: "DIC_kwDOThvy7s4DB12m"
    mapping: "url"
    reactions-enabled: true
    input-position: top
    theme: preferred_color_scheme
    language: en
    loading: lazy

execute:
  freeze: auto
