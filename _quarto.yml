project:
  type: website
  resources:
  - CNAME

website:
  title: "Lux Ferrata"
  description: "Personal blog."
  site-url: "https://lux-ferrata.org"
  favicon: Penrose_Valknut-3.svg
  search: true
  open-graph:
    image: Penrose_Valknut-3.svg
  page-footer:
    center: "© 2026 Lux Ferrata · Made with [Quarto](https://quarto.org) · [Content Policies](content-policies.qmd)"
  navbar:
    right:
      - text: About
        href: author.qmd
      - text: Posts
        href: index.qmd
      - text: Projects
        href: projects.qmd
      - text: Archive
        href: archive.qmd
      - icon: github
        text: GitHub
        href: https://github.com/lux-ferrata
      - icon: rss
        text: RSS
        href: index.xml

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    html-math-method: mathjax
    toc: true
    toc-location: right
    code-copy: true
    code-fold: true
    citations-hover: true
    include-after-body:
      text: |
        <script data-goatcounter="https://xin-ferrata.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>

comments:
  giscus:
    repo: "lux-ferrata/lux-ferrata.github.io"
    repo-id: "R_kgDOThvy7g"
    category: "Announcements"
    category-id: "DIC_kwDOThvy7s4DB12m"
    mapping: "url"
    reactions-enabled: true
    input-position: top
    theme: preferred_color_scheme
    language: en
    loading: lazy

execute:
  freeze: auto
